name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend checks
        run: npm run check
      - name: Run focused behavior tests
        run: npm run test:voice && npm run test:contextual && npm run test:onboarding && npm run test:auth

  # Does every button in the app still do what it is supposed to do?
  #
  # The `frontend` job above proves the code compiles, lints, and references
  # only tokens and classes that exist. None of that has ever established that
  # a click does anything: a button whose endpoint was renamed underneath it
  # passes every one of those checks and fails for the teacher. See
  # frontend/scripts/test-buttons.mjs for what it asserts and why.
  #
  # Needs a real browser, hence its own job rather than a step inside
  # `frontend`. It drives frontend/preview.html — the real App.jsx against the
  # canned backend in src/dev/mockApi.js — so there is no database, no API key
  # and no Google OAuth involved, and nothing here touches production.
  #
  # BUDGET: same 2,000 min/month cap uptime.yml documents. The playwright
  # container is pre-baked and the suite crawls four routes at a time, so a run
  # is ~2 minutes — cheap enough to run on every push rather than path-gate,
  # which would mean a paths-filter action and a second job to decide.
  buttons:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Click every button
        # Server and suite in ONE step on purpose. `npm run dev` never exits,
        # so it has to be backgrounded — and a background process started in an
        # earlier step is not something to rely on surviving into a later one.
        # Polled rather than slept: a fixed sleep is either too short on a cold
        # runner or wasted time on a warm one. Polled with node rather than
        # curl, which this image does not promise to ship — node is the one
        # thing the job cannot be missing.
        #
        # 127.0.0.1, NOT localhost. Vite binds IPv4 only, and node's fetch
        # resolves localhost to ::1 first inside this container — so the poll
        # spent its full sixty seconds failing to reach a server that had
        # printed "ready in 405 ms" one line earlier, and the suite never ran.
        # The error is printed now rather than swallowed, so the next version
        # of that mistake says what it was.
        env:
          BUTTONS_BASE: http://127.0.0.1:5174
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            node -e "fetch('$BUTTONS_BASE/preview.html').then(r => process.exit(r.ok ? 0 : 1)).catch(e => { console.error(e.cause?.code || e.message); process.exit(1) })" && break
            if [ "$i" = "60" ]; then echo "preview harness never came up at $BUTTONS_BASE" >&2; exit 1; fi
            sleep 1
          done
          npm run test:buttons

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend development dependencies
        run: pip install -e ".[dev]"
      - name: Compile backend modules
        run: python -m compileall -q backend
      - name: Run backend lint
        run: ruff check backend
      - name: Run eval suites that need no DB or API
        # eval/run_all.py --fast runs exactly the suites its own SUITES list
        # marks needs_corpus=False: test_grounding_audit, test_field_scoped_
        # revise, test_entitlement — real regression coverage (the retrieval
        # code-shape parser, the schema contract, the paywall math) that ran
        # only by hand before this, despite `compileall`+`ruff` alone never
        # having caught any of it.
        #
        # Four more suites (test_chat_pacing_guide, test_chat_week_context,
        # test_schoolcal_per_school, test_quiz_generation) LOOK db-free from
        # their own docstrings but aren't fully: each stubs some db.* calls
        # on its own code path but not all of them (e.g.
        # test_quiz_generation.py stubs llm.db.get_llm_cache but not the
        # db.get_user_by_id a few frames deeper via custom_instructions_for).
        # That's invisible with a real local DATABASE_URL — the unstubbed
        # call just quietly succeeds against whatever's really there — but
        # breaks outright here, where none is set. Confirmed 2026-08-26 (see
        # eval/run_all.py's own comment on the SUITES list) and reclassified
        # needs_corpus=True until each gets the same complete-stub fix
        # test_entitlement's db.get_app_settings gap already got.
        #
        # The remaining suites (test_security_contracts.py and the retrieval
        # sweeps) genuinely need a real DATABASE_URL/OPENAI_API_KEY and, per
        # test_security_contracts.py's own docstring, a database the runner
        # doesn't mind it writing throwaway accounts into — not something to
        # point at production from a public CI runner without a deliberate
        # decision on which DB that is, so they stay a manual
        # `./venv/bin/python eval/run_all.py` before anything touching
        # retrieval/auth ships, exactly as eval/README.md already documents.
        run: python eval/run_all.py --fast
