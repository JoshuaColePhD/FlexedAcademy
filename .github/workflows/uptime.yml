# Is the deployed site usable by a stranger?
#
# The Quality workflow proves the code is sound. This proves the thing running
# at flexedacademy.com right now actually works — which is not the same
# question, and the difference has already cost an outage: a bug shipped that
# left every logged-out visitor on a blank boot screen while `/` returned 200,
# /api/health returned ok, /api/health/ready returned ok, and Sentry saw
# nothing because nothing threw. It was found by a person opening the site.
#
# Needs a real browser. The app is a single-page app, so `curl /` returns a
# shell containing none of the landing page's words — any check that doesn't
# execute JavaScript cannot catch this class of failure and would have stayed
# green throughout. See scripts/smoke_production.mjs.
#
# BUDGET (this repo is private, so Actions minutes are capped at 2,000/month):
# the playwright container is pre-baked, so a run is ~1 minute. The schedule
# below is 8 runs/day plus one per deploy — roughly 300 runs and ~350 minutes
# a month, well inside the allowance. Deliberately NOT every 10 minutes; the
# point is to catch a bad deploy within hours instead of never, and a
# tighter loop would spend the budget without changing that.
name: Uptime

on:
  # Keep post-deploy monitoring outside commit CI: checksPass deploy gating
  # would otherwise wait on a smoke job that is itself waiting for the deploy.
  # And a few times a day, to catch anything that breaks without a deploy
  # (an expired cert, a dead database, a Render incident).
  schedule:
    - cron: "0 12,15,18,21 * * *" # ~6am/9am/12pm/3pm US Central
    - cron: "0 0,3 * * *" #  ~7pm/10pm US Central
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional deployed commit SHA to wait for before smoke testing"
        required: false
        type: string

# A later run's result supersedes an in-flight one; no value in queueing them.
concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Browsers preinstalled — avoids ~60s of `playwright install` per run,
    # which at this frequency is most of the cost.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v5

      # Manual release verification checks the serving revision, never a
      # guessed deploy duration. Scheduled uptime still checks the live site.
      - name: Verify the requested release is serving
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          node --input-type=module <<'JS'
          const deadline = Date.now() + 600000
          let matched = false
          while (Date.now() < deadline) {
            try {
              const res = await fetch('https://flexedacademy.com/api/version', { signal: AbortSignal.timeout(5000), cache: 'no-store' })
              const version = await res.json()
              if (version.release_sha === process.env.EXPECTED_SHA) { matched = true; break }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 10000))
          }
          if (!matched) throw new Error('Requested release did not become ready within ten minutes')
          JS

      - name: Install playwright
        run: npm install --no-save playwright@1.56.0

      - name: Smoke the live site
        run: node scripts/smoke_production.mjs "$SMOKE_URL"
        env:
          SMOKE_URL: https://flexedacademy.com
