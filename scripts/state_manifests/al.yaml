# ── class -> standards binding ───────────────────────────────────────────
#
# Which framework a teacher's (subject, grade) actually grounds in. Authored
# and reviewed as data, NOT inferred from whatever course strings the parse
# happened to emit — inference is how "ELA" in one state silently binds to a
# different state's idea of ELA.
#
# NOT WIRED INTO RETRIEVAL FOR ALABAMA. Alabama keeps the existing
# normalize_course()/course_variants() path, because changing how its bindings
# resolve would break the guarantee that its retrieval results are unchanged.
# This block exists so the totality checks in check_state_ingest.py can run
# against Alabama too, and so the eventual migration has something to be
# proven equal to.
course_map:
  - subject_code: ELA
    source_id: ELA
    grades: [9, 10, 11, 12]
  - subject_code: Math
    source_id: Math
    grades: [9, 10, 11, 12]
  - subject_code: Science
    source_id: Science
    grades: [9, 10, 11, 12]
  - subject_code: Social_Studies
    source_id: Social_Studies
    grades: [9, 10, 11, 12]
  - subject_code: Arts
    source_id: Arts
    grades: [9, 10, 11, 12]
  - subject_code: DLCS
    source_id: DLCS
    grades: [9, 10, 11, 12]
  - subject_code: Health
    source_id: Health
    grades: [9, 10, 11, 12]
  - subject_code: PE
    source_id: PE
    grades: [9, 10, 11, 12]
  - subject_code: World_Languages
    source_id: World_Languages
    grades: [9, 10, 11, 12]
  - subject_code: Counseling
    source_id: Counseling
    grades: [9, 10, 11, 12]
  - subject_code: Math_AWF
    source_id: Math_AWF
    grades: [9, 10, 11, 12]

  # An AP course grounds in the College Board framework, never in the state
  # course of study — see backend/retrieval.py's _SHARED_VARIANTS note. It is
  # bound explicitly rather than left unmapped, because "no state framework"
  # is a real answer here, not a gap.
  - subject_code: AP_Lang
    target: national_only
    grades: [9, 10, 11, 12]

# Subjects the app offers that Alabama has no course-of-study framework for.
# Declared so the totality check can tell "deliberately unbound" from
# "someone forgot", which is the only reason that check is worth running.
unmapped:
  - subject_code: Special_Education
    reason: >-
      ALSDE publishes no separate Special Education course of study; those
      classes ground in the general framework for the subject being taught.
