# Alabama — state standards ingestion manifest.
#
# Transcribed from scripts/alabama_ingest_config.py and the provenance already
# recorded in data/raw/ALCOS_INGEST_REPORT.json. No new facts: the CASE ids,
# framework titles, PDF names and official source URLs are the ones the live
# Alabama corpus was actually built from.
#
# `sha256`/`package_sha256` are deliberately absent here rather than copied.
# They are properties of a fetch, and scripts/fetch_state_sources.py writes them
# when it takes a snapshot. Alabama was ingested before that existed, so its
# hashes live in the ingest report until the next refresh writes them here.

state: Alabama
state_code: AL
ingestion_contract_version: 1
authority: Alabama State Department of Education (ALSDE)
case_api: https://alabamastandards.org/ims/case/v1p0

# ALSDE publishes the Course of Study documents and the CASE feed openly, with
# no registration or API key. Recorded as a reviewed note, not a legal opinion.
license_or_usage: >-
  Published openly by ALSDE for public use; keyless CASE 1.0 feed. Reviewed
  2026-09-05. Re-check before redistributing source PDFs.

# Grades to ingest by default. Alabama is deliberately 9-12: this is the live
# corpus the app serves today, and widening it would change which standards are
# in each course's candidate pool, which moves the calibrated relevance floors.
default_grades: "9-12"

pdf_dir: "../Florence High School 2026-2027/_Shared/Alabama Standards"
output: data/processed/alcos_chunks.json

