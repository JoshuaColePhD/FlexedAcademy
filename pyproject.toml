[project]
name = "ap-lang-rag"
version = "2.0.0"
description = "Standards-grounded AP Language lesson plan generator"
requires-python = ">=3.12"

# Pinned to what is actually installed and working in venv/ as of 2026-08-04,
# since there was no manifest at all before this and the venv was the only record.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-dotenv==1.2.2",
  "python-multipart",
  "openai==2.52.1",
  "psycopg2-binary",
  "pgvector==0.3.2",
  "sentence-transformers==5.6.1",
  "python-docx==1.2.0",
  "google-auth==2.56.2",
  "requests",
]

[project.optional-dependencies]
dev = ["httpx"]

[tool.setuptools]
packages = ["backend", "backend.routes"]

[tool.ruff]
line-length = 100
target-version = "py312"
