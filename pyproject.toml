[project]
name = "flexed-academy"
version = "2.0.0"
description = "Standards-grounded lesson plan generator"
requires-python = ">=3.12"

# Pinned to what is actually installed and working in venv/ as of 2026-08-04,
# since there was no manifest at all before this and the venv was the only record.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.32",
  "openai==2.52.1",
  "psycopg2-binary==2.9.12",
  "pgvector==0.3.2",
  # sentence-transformers was removed here deliberately. It existed to turn a
  # query into a 384-dim vector, and dragged in torch (518MB) + transformers
  # (98MB) to do it — which is what made this app awkward to host and what
  # forced the model download at boot. That job is now one OpenAI API call; see
  # backend/embeddings.py. Re-adding it means re-embedding the corpus.
  "python-docx==1.2.0",
  "google-auth==2.56.2",
  "requests==2.34.2",
  "urllib3>=2.7.0",
  "email-validator==2.3.0",
  "slowapi==0.1.9",
  "sentry-sdk[fastapi]==2.68.0",
  "pypdf==6.16.1",
  # Structural PDF analysis for school lesson-plan templates (fonts, glyph
  # positions, ruled tables) — pypdf's extract_text() and the pdftotext CLI
  # (routes/misc.py) both discard that; pdfplumber is the one already-vetted
  # dependency in this ecosystem that surfaces it without shelling out.
  # 0.11.7 -> 0.11.10: pulls in a fixed pdfminer.six (was ==20250506, two
  # known CVEs -- PYSEC-2026-1762/1761 -- fixed upstream in 20251107/20251230;
  # 0.11.10 pins pdfminer.six==20260107, past both).
  "pdfplumber==0.11.10",
  # OCR fallback for scanned-image template PDFs (template_intake.py). Both
  # are pure-Python wrappers with no compiled extensions of their own, but
  # each shells out to a system binary this doesn't install: pdf2image needs
  # poppler's pdftoppm (already assumed present — routes/misc.py already
  # shells out to poppler's pdftotext), pytesseract needs the tesseract-ocr
  # binary (new — see Dockerfile). template_intake.py checks for it with
  # shutil.which() before ever importing this, so an environment without
  # tesseract installed degrades to today's plain "can't read a scanned PDF"
  # error rather than crashing.
  "pdf2image==1.17.0",
  "pytesseract==0.3.13",
]

[project.optional-dependencies]
dev = ["httpx", "ruff"]

[tool.setuptools]
packages = ["backend", "backend.routes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# N999 (invalid module name) is correct in general and wrong here. A school's
# hand-written builder MUST be named "{school_id}_builder.py" — docx_build.py
# looks it up by that exact string (`path.parent / f"{school_id}_builder.py"`),
# and school ids are hyphenated slugs like weeden-elementary-school. The
# hyphen is a lookup key, not a typo: renaming the file to satisfy the linter
# would silently stop that school's own template from ever being found, which
# is the bug this whole path exists to prevent. These modules are loaded by
# path via importlib, never imported by name, so the rule's actual concern
# (an unimportable module) does not apply.
"backend/builder/*_builder.py" = ["N999"]

[tool.ruff.lint.flake8-bugbear]
# B008 already exempts FastAPI's other call-as-default markers (Depends, Form,
# Query, ...) since they're immutable factories evaluated once per request by
# FastAPI itself, not a mutable default shared across calls. File(...) is the
# same pattern and belongs on the same allowlist rather than six scattered
# per-route noqa comments.
extend-immutable-calls = ["fastapi.File"]
