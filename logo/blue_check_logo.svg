<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>
  
  <!-- Rounded square background with warm off-white color -->
  <rect x="20" y="20" width="80" height="80" rx="22" fill="#F6F4EB" filter="url(#shadow)" />
  
  <!-- Blue circle -->
  <circle cx="60" cy="60" r="26" fill="none" stroke="#325FCC" stroke-width="8" />
  
  <!-- Blue checkmark with tips perfectly meeting the circle edge -->
  <path d="M 39 71 L 50 78 L 77.3 46.3" fill="none" stroke="#325FCC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
