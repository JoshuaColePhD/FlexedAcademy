<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>
  
  <!-- White circular background with soft shadow -->
  <circle cx="60" cy="60" r="56" fill="#FFFFFF" filter="url(#shadow)" />
  
  <!-- Purple outer dashed ring (ticks) -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="3 5.5" stroke-linecap="round" />
  
  <!-- Purple inner solid ring -->
  <circle cx="60" cy="60" r="43" fill="none" stroke="#8B5CF6" stroke-width="4" />
  
  <!-- Purple checkmark -->
  <path d="M 40 62 l 12 12 l 26 -28" fill="none" stroke="#8B5CF6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
