# Render blueprint.
#
# The `sync: false` keys cannot live here — that setting tells Render to prompt
# for a value in the dashboard rather than read one from this tracked file.
#
# Two things worth reading before the first deploy:
#
#   DATABASE_URL must be the Supabase CONNECTION POOLER, not the direct host.
#   db.<ref>.supabase.co resolves IPv6-only and Render's outbound is IPv4, so a
#   direct URL fails with "No route to host" — the same failure it gives on a
#   machine without IPv6 egress. Get the pooler string from Supabase → Project
#   Settings → Database → Connection pooling; the username becomes
#   postgres.<project-ref>.
#
#   Footprint: query embedding moved to the OpenAI API, so torch (518MB),
#   transformers (98MB) and sentence-transformers are all gone, along with the
#   model download at first boot and the CrossEncoder's OOM risk. What's left —
#   fastapi, pydantic, openai, psycopg2, python-docx — fits the free plan's 512MB
#   with room to spare and builds in a fraction of the time.
services:
  - type: web
    name: flexed-academy-backend
    env: python
    plan: free
    # Push to master -> Render rebuilds and redeploys, no dashboard visit. This
    # is Render's default, but it is stated here so the deploy loop is a fact of
    # the repo rather than a setting someone has to remember checking.
    #
    # The build runs the FULL pipeline: npm ci, vite build, pip install. So a
    # one-line frontend change is a several-minute rebuild on the free plan, and
    # the service is down while it swaps. Batch changes rather than pushing ten
    # times in a row.
    branch: master
    autoDeploy: true
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -e ."
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      # ── set these in the dashboard ────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: COMMON_STANDARDS_API_KEY
        sync: false
      # Vite inlines this at BUILD time, so it must exist before the build runs,
      # not merely at boot. Without it GoogleOAuthProvider receives clientId
      # undefined and the Google button on the login page renders but fails.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

      # ── billing (Stripe) ─────────────────────────────────────────────────
      # The subscription gate is INERT until all three of these are set, so
      # the app runs perfectly well with them blank — that is deliberate, not
      # a half-finished state. Set them together or not at all; two out of
      # three leaves the gate closed and no way through it.
      #
      #   STRIPE_SECRET_KEY      sk_live_… (Developers → API keys)
      #   STRIPE_PRICE_ID        price_…   the recurring price, NOT the product
      #   STRIPE_WEBHOOK_SECRET  whsec_…   shown when the endpoint is created
      #
      # The webhook endpoint is https://<host>/api/billing/webhook and must be
      # subscribed to: checkout.session.completed, customer.subscription.created,
      # customer.subscription.updated, customer.subscription.deleted. Without
      # the subscription events a cancellation never reaches this app and the
      # account stays entitled forever.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Where Stripe sends the browser back to. Without it the app falls back
      # to the request's own origin, which is right locally and wrong behind
      # any proxy that rewrites Host.
      - key: BILLING_RETURN_URL
        value: "https://flexedacademy.com"

      # ── generated once by Render, then held ──────────────────────────────
      # Login is on in production and session cookies are signed with this.
      # Unset, config.py falls back to a known dev string and every session
      # cookie is forgeable by anyone who can read the source.
      - key: SESSION_SECRET
        generateValue: true

      # ── fixed ────────────────────────────────────────────────────────────
      - key: REQUIRE_LOGIN
        value: "true"
      # Render terminates TLS, so the session cookie can and must be marked
      # Secure — without it the browser will happily send a real teacher's
      # session token over plain HTTP. Stays false locally, where the app is
      # served over http://127.0.0.1 and a Secure cookie would never be sent.
      - key: COOKIE_SECURE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.3"
