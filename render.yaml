# Render blueprint.
#
# The `sync: false` keys cannot live here — that setting tells Render to prompt
# for a value in the dashboard rather than read one from this tracked file.
#
# Two things worth reading before the first deploy:
#
#   DATABASE_URL must be the Supabase CONNECTION POOLER, not the direct host.
#   db.<ref>.supabase.co resolves IPv6-only and Render's outbound is IPv4, so a
#   direct URL fails with "No route to host" — the same failure it gives on a
#   machine without IPv6 egress. Get the pooler string from Supabase → Project
#   Settings → Database → Connection pooling; the username becomes
#   postgres.<project-ref>.
#
#   Footprint: query embedding moved to the OpenAI API, so torch (518MB),
#   transformers (98MB) and sentence-transformers are all gone, along with the
#   model download at first boot and the CrossEncoder's OOM risk. What's left —
#   fastapi, pydantic, openai, psycopg2, python-docx — fits the free plan's 512MB
#   with room to spare and builds in a fraction of the time.
services:
  - type: web
    name: flexed-academy-backend
    env: python
    plan: free
    # Push to master -> Render rebuilds and redeploys, no dashboard visit. This
    # is Render's default, but it is stated here so the deploy loop is a fact of
    # the repo rather than a setting someone has to remember checking.
    #
    # The build runs the FULL pipeline: npm ci, vite build, pip install. So a
    # one-line frontend change is a several-minute rebuild on the free plan, and
    # the service is down while it swaps. Batch changes rather than pushing ten
    # times in a row.
    branch: master
    autoDeploy: true
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -e ."
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health/ready
    envVars:
      # ── set these in the dashboard ────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      # Durable file storage. Without these optional values the app keeps the
      # local fallback, which is suitable for development but ephemeral on
      # Render. Set the bucket up once in Supabase Storage before enabling.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: "flexed-academy"
      - key: OPENAI_API_KEY
        sync: false
      - key: COMMON_STANDARDS_API_KEY
        sync: false
      # Not secrets, so tracked directly here rather than left to the
      # dashboard. KNOWN_GAPS.md documented RETRIEVAL_MAX_DISTANCE as
      # "measured at 0.78" but it was never actually present in this file (or
      # in a real .env — only in .env.example as a template), so production
      # had been running on backend/config.py's fallback default of 0.65
      # since that measurement was written. 0.65 is tighter than every
      # framework's "safe at 0.78" margin in that table, so nothing became
      # unsafe, but it risked rejecting legitimate in-domain queries that
      # fell between 0.65 and 0.78. See KNOWN_GAPS.md's floor-calibration
      # section for the per-course RETRIEVAL_FLOORS values and how each was
      # measured (scripts/06_threshold_sweep.py).
      - key: RETRIEVAL_MAX_DISTANCE
        value: "0.78"
      - key: RETRIEVAL_FLOORS
        value: '{"Math": 0.52, "Science": 0.55, "PE": 0.60, "AP_Lang": 0.64}'
      # Vite inlines this at BUILD time, so it must exist before the build runs,
      # not merely at boot. Without it GoogleOAuthProvider receives clientId
      # undefined and the Google button on the login page renders but fails.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      # The BACKEND half of the same credential, and a separate variable in this
      # codebase. It was missing from this file entirely, which made "Continue
      # with Google" — the sign-in path the login page offers first — fail 100%
      # of the time in production: verify_google_token returns None the moment
      # settings.google_client_id is falsy (auth.py), and google_login turns
      # that into "Invalid Google token", which the form shows to the teacher as
      # though she had done something wrong. Same value as VITE_GOOGLE_CLIENT_ID.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # CORS. This is a single service — the build bundles the frontend as
      # static assets served by this SAME FastAPI app (buildCommand above,
      # server.py's serve_spa) — so ordinary browser traffic to
      # flexedacademy.com is same-origin and never touches this check at
      # all. It matters the moment that stops being true: a custom domain
      # added alongside the default onrender.com one, a future split
      # frontend deploy, or a teacher-facing API client hitting this from
      # somewhere else. Left unset, config.py's default is dev-only
      # localhost origins, which would reject exactly that traffic with no
      # explanation beyond a browser console CORS error. Not a secret, so
      # tracked directly here rather than left to the dashboard.
      - key: ALLOWED_ORIGINS
        value: "https://flexedacademy.com"

      # ── transactional email (Resend) ──────────────────────────────────────
      # Without these, "Forgot your password?" is a permanent silent no-op:
      # mail.send() logs a warning and returns False, forgot_password discards
      # that boolean and answers {"ok": true}, and the UI tells the teacher a
      # link is on its way. For an email+password account there is no other
      # recovery path, so the account is simply lost.
      #
      # EMAIL_FROM matters as much as the key: it defaults to Resend's sandbox
      # sender, which by design only delivers to the inbox that owns the API
      # key — so with the key set and this unset, reset mail reaches nobody but
      # you. Use an address on a domain verified with Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # ── error tracking (Sentry) ──────────────────────────────────────────
      # server.py only calls sentry_sdk.init if this is set (backend/config.py
      # defaults sentry_dsn to "", same inert-until-configured shape as
      # Stripe/Resend). This key was never declared here at all, which means
      # a deploy that never visits the dashboard for it ships with NO error
      # tracking and no way to notice — stdout logs only, read by nobody
      # until a teacher reports something broken. Get the DSN from
      # Sentry → Settings → Client Keys (DSN) for the project.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: "production"

      # ── billing (Stripe) ─────────────────────────────────────────────────
      # The subscription gate is INERT until all three of these are set, so
      # the app runs perfectly well with them blank — that is deliberate, not
      # a half-finished state. Set them together or not at all; two out of
      # three leaves the gate closed and no way through it.
      #
      #   STRIPE_SECRET_KEY      sk_live_… (Developers → API keys)
      #   STRIPE_PRICE_ID        price_…   the recurring price, NOT the product
      #   STRIPE_WEBHOOK_SECRET  whsec_…   shown when the endpoint is created
      #
      # The webhook endpoint is https://<host>/api/billing/webhook and must be
      # subscribed to: checkout.session.completed, customer.subscription.created,
      # customer.subscription.updated, customer.subscription.deleted. Without
      # the subscription events a cancellation never reaches this app and the
      # account stays entitled forever.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Where Stripe sends the browser back to. Without it the app falls back
      # to the request's own origin, which is right locally and wrong behind
      # any proxy that rewrites Host.
      - key: BILLING_RETURN_URL
        value: "https://flexedacademy.com"

      # ── Google Drive sharing ─────────────────────────────────────────────
      # Same reasoning as BILLING_RETURN_URL just above, for the same proxy
      # reason: Render terminates TLS, so request.base_url (routes/drive.py's
      # own fallback) resolves to http:// internally, and Google rejects any
      # redirect_uri that doesn't exactly match what's registered on the
      # OAuth client — this was the missing half of that fix, added only for
      # billing at the time. This exact URL must ALSO be added as an
      # "Authorized redirect URI" on the OAuth client in Google Cloud
      # Console (APIs & Services -> Credentials) — setting it here alone
      # only fixes what THIS app sends Google, not what Google's willing to
      # accept back.
      - key: DRIVE_REDIRECT_URL
        value: "https://flexedacademy.com/api/drive/callback"

      # ── generated once by Render, then held ──────────────────────────────
      # Login is on in production and session cookies are signed with this.
      # Unset, config.py falls back to a known dev string and every session
      # cookie is forgeable by anyone who can read the source.
      - key: SESSION_SECRET
        generateValue: true

      # ── fixed ────────────────────────────────────────────────────────────
      - key: REQUIRE_LOGIN
        value: "true"
      # Render terminates TLS, so the session cookie can and must be marked
      # Secure — without it the browser will happily send a real teacher's
      # session token over plain HTTP. Stays false locally, where the app is
      # served over http://127.0.0.1 and a Secure cookie would never be sent.
      - key: COOKIE_SECURE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.3"
