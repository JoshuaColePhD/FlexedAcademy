<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- One mark, not five bars — a checkmark reads at 16px where a bar chart
       muddies into noise. It's also not a generic UI glyph borrowed for the
       occasion: this app's whole pitch is standards quoted and grounded, not
       guessed, and a check is what that verification actually looks like
       everywhere else in the product (the landing page's own claims list,
       WeekStrip's finished days). Colors are the base light-theme tokens
       (tokens.css's paper and accent primitives), not the neomorphic
       override, so the tab icon stays the one identity that's always true
       regardless of in-app theme.

       Neomorphic on request: the same light/dark pair the in-app world
       computes its emboss from (tokens.css's neo-light/neo-dark primitives),
       baked into two feDropShadow filters instead of a CSS box-shadow —
       favicons render outside any stylesheet, so the emboss has to be part
       of the artwork itself. Offsets are sub-pixel; at 16px they read as
       "this has depth," not as two visible shadows. -->
  <defs>
    <filter id="embossBg" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0.8" dy="0.8" stdDeviation="0.7" flood-color="#c7c2bc" flood-opacity="0.85" />
      <feDropShadow dx="-0.7" dy="-0.7" stdDeviation="0.7" flood-color="#ffffff" flood-opacity="0.9" />
    </filter>
    <filter id="embossCheck" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="0.35" flood-color="#173166" flood-opacity="0.5" />
      <feDropShadow dx="-0.4" dy="-0.4" stdDeviation="0.35" flood-color="#9db8ee" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#F6F4EC" filter="url(#embossBg)" />
  <path
    d="M9 16.5l4.5 4.5L23 11"
    fill="none"
    stroke="#2F5FBF"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#embossCheck)"
  />
</svg>
