<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Was /logo.png, a 1024px 399KB file, downloaded on every cold load. On
         school wifi that is most of a second spent on a 16px square.

         SVG first: every browser that matters now supports it, it stays
         crisp at any tab/pinned-tab size instead of just 32px, and it's
         under 1KB versus favicon-32's raw pixels. The PNG stays as the
         fallback for the one thing SVG can't do here — apple-touch-icon
         has its own tag below and needs a raster regardless. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!-- The web app manifest alone gets "Add to Home Screen" most of the way
         on Android/Chrome (display: standalone triggers a real install
         prompt there) but iOS Safari still ignores it for launch behavior —
         it only reads the three apple-mobile-web-app-* tags below. Without
         them, a teacher who added this to her home screen got a Safari tab
         with the URL bar and back/forward chrome, not the "no browser at
         all" app-like launch this pair of platforms otherwise disagrees
         about how to opt into. mobile-web-app-capable is the same signal
         for the (still-growing) set of non-iOS browsers now honoring it
         instead of just the manifest. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent": translucent draws the status bar
         AS page content, which then needs safe-area padding added by hand to
         avoid the clock/battery icons overlapping the header — default just
         gives the status bar the theme-color background above already sets,
         no extra layout work. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- iOS shows this under the home-screen icon instead of reading
         manifest.json's own short_name, which it doesn't consult here. -->
    <meta name="apple-mobile-web-app-title" content="FlexEd" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) return anything
         other than 0 — without it the safe-area tokens are dead weight and a
         bottom bar sits under the home indicator.

         interactive-widget=resizes-content shrinks the layout viewport when the
         soft keyboard opens, instead of letting the page scroll underneath it.
         Chromium-only; iOS relies on --app-h being 100dvh.

         No maximum-scale / user-scalable=no: teachers zoom into standards text,
         and disabling that is an accessibility failure, not a polish win. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Value is written by the pre-paint script below so it follows data-theme
         rather than the system scheme; a teacher who forced light mode on a dark
         phone should not get a dark status bar. -->
    <meta name="theme-color" content="#f6f4ec" />
    <meta
      name="description"
      content="Build a week of lesson plans for your class, grounded in the Alabama Course of Study and delivered in the Florence City Schools template."
    />
    <title>FlexEd Academy</title>

    <!-- Self-hosted (src/styles/fonts.css, from @fontsource/*) rather than
         Google's own CSS + CDN — that used to cost a DNS+TLS round trip to
         fonts.googleapis.com just to learn the font URLs, then a second to
         fonts.gstatic.com for the files themselves, before Inter could even
         start downloading. One same-origin stylesheet removes both hops,
         which matters most exactly where it's slowest: school wifi. Same
         font-display: swap, same latin/latin-ext-only subsets Google would
         have served this app anyway (no Cyrillic/Greek/Vietnamese text
         anywhere in it), so the byte budget doesn't change — only the
         number of round trips to pay it does. See fonts.css's own header for
         how to regenerate it if a weight or family ever needs to change.

         Inter is the whole interface; JetBrains Mono sets standard codes, which
         are identifiers and should look like identifiers. Newsreader used to be
         requested for a serif greeting on the home screen — the week board
         replaced that screen, so the font was being downloaded for nothing.

         Bricolage Grotesque (display) and Source Serif 4 (quoted document
         excerpts) are landing-page-only, same rule as --brand violet: used by
         .land-* classes and nowhere in the authenticated app, which stays on
         Inter + JetBrains Mono alone. -->
    <link rel="stylesheet" href="/src/styles/fonts.css" />

    <!-- Set the theme before first paint so a dark-mode load doesn't flash white. -->
    <script>
      try {
        var saved = localStorage.getItem('aplang.theme') || 'system'
        var dark =
          saved === 'dark' ||
          (saved === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        // Browser chrome (iOS status bar, Android URL bar) matches --paper.
        // Literal hex because a meta tag can't read a custom property; these are
        // the two --paper-rgb values in tokens.css.
        var tc = document.querySelector('meta[name="theme-color"]')
        if (tc) tc.setAttribute('content', dark ? '#1f1d1b' : '#f6f4ec')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
      // Same reasoning, for the neomorphic/skeuomorphic skin toggle
      // (useDesignSkin.js) — set before first paint so switching skins and
      // reloading doesn't flash the OTHER one for a frame.
      try {
        var savedSkin = localStorage.getItem('aplang.skin')
        document.documentElement.setAttribute('data-skin', savedSkin === 'skeu' ? 'skeu' : 'neo')
      } catch (e) {
        document.documentElement.setAttribute('data-skin', 'neo')
      }
    </script>
  </head>
  <!-- No oncontextmenu handler. Suppressing right-click across the whole app was
       borrowed from IDE chrome, but teachers copy text out of a plan constantly
       and it broke every one of those attempts. -->
  <!-- h-app not h-screen: see --app-h in tokens.css.
       w-full not w-screen: 100vw includes the scrollbar gutter, which overflows
       the document by ~15px on Windows and gives every page a horizontal
       scrollbar it never asked for. -->
  <body
    class="h-app w-full overflow-hidden bg-paper text-ink font-sans selection:bg-accent/15 overscroll-none"
  >
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
